[project]
id = "boom"
version = "0.23.0"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
default = true
isa = "x86_64"
os  = "linux"
abi = "sysv64"

[target.windows]
isa = "x86_64"
os  = "windows"
abi = "win64"

[target.darwin]
isa = "x86_64"
os  = "darwin"
abi = "sysv64"

# boom negotiates down to a vulkan 1.0 instance, so its modules stay within that ceiling
[target.spirv]
isa = "spirv"
os  = "freestanding"
abi = "spirv"
env = "vulkan1.0"

[profile.debug]
default = true
opt = 0
debug = true
simd = "scalarize"
vectorize = false
float_reassoc = false

[profile.release]
opt = 2
debug = false
simd = "scalarize"
vectorize = false
float_reassoc = false

[artifact.boom]
default = true
kind = "static"
entry = "lib/boom.mach"
out = "lib/boom{artifact.suffix}"
targets = ["linux-x86_64", "windows", "darwin"]
link = []
need = []

[artifact.shader-lit_frag]
kind = "bin"
entry = "shaders/lit_frag.mach"
out = "spv/lit_frag{artifact.suffix}"
targets = ["spirv"]
link = []
need = []

[artifact.shader-mesh_vert]
kind = "bin"
entry = "shaders/mesh_vert.mach"
out = "spv/mesh_vert{artifact.suffix}"
targets = ["spirv"]
link = []
need = []

[artifact.shader-skinned_vert]
kind = "bin"
entry = "shaders/skinned_vert.mach"
out = "spv/skinned_vert{artifact.suffix}"
targets = ["spirv"]
link = []
need = []

[artifact.shader-ui_vert]
kind = "bin"
entry = "shaders/ui_vert.mach"
out = "spv/ui_vert{artifact.suffix}"
targets = ["spirv"]
link = []
need = []

[artifact.shader-ui_frag]
kind = "bin"
entry = "shaders/ui_frag.mach"
out = "spv/ui_frag{artifact.suffix}"
targets = ["spirv"]
link = []
need = []

