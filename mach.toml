[project]
id = "boom"
version = "0.2.0"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
isa = "x86_64"
os  = "linux"
abi = "sysv64"

[target.windows]
isa = "x86_64"
os  = "windows"
abi = "win64"

[target.darwin]
isa = "x86_64"
os  = "darwin"
abi = "sysv64"

[profile.debug]
opt = 0
debug = true
simd = "scalarize"

[profile.release]
opt = 2
debug = false
simd = "scalarize"

[artifact.boom]
kind = "static"
entry = "lib/boom.mach"
out = "lib/boom"
targets = ["*"]
link = []
need = []

[dep.mach-std]
git = "https://github.com/briar-systems/mach-std"
ref = "branch/main"

[dep.mach-glfw]
git = "https://github.com/briar-systems/mach-glfw"
ref = "branch/main"

[dep.mach-gl]
git = "https://github.com/briar-systems/mach-gl"
ref = "branch/main"

[dep.mach-audio]
git = "https://github.com/briar-systems/mach-audio"
ref = "branch/main"

[dep.mach-image]
git = "https://github.com/briar-systems/mach-image"
ref = "branch/main"

[dep.mach-font]
git = "https://github.com/briar-systems/mach-font"
ref = "branch/main"

[dep.mach-phys]
git = "https://github.com/briar-systems/mach-phys"
ref = "branch/main"

[dep.mach-gltf]
git = "https://github.com/briar-systems/mach-gltf"
ref = "branch/main"
