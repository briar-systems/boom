[project]
id = "boom"
version = "0.16.0"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
isa = "x86_64"
os  = "linux"
abi = "sysv64"

[target.windows]
isa = "x86_64"
os  = "windows"
abi = "win64"

[target.darwin]
isa = "x86_64"
os  = "darwin"
abi = "sysv64"

[target.spirv]
isa = "spirv"
os  = "freestanding"
abi = "spirv"
of  = "spv"

[profile.debug]
opt = 0
debug = true
simd = "scalarize"

[profile.release]
opt = 2
debug = false
simd = "scalarize"

[artifact.boom]
kind = "static"
entry = "lib/boom.mach"
out = "lib/boom"
targets = ["linux-x86_64", "windows", "darwin"]
link = []
need = ["build-shaders"]

# THE MODULES ARE NAMED, NOT GLOBBED. A `*.spv` copy takes whatever is in the
# build directory, which includes the output of a shader that has since been
# deleted: the sprite pair survived its own removal that way and would have been
# embedded again. Naming them means a module that is not in this list cannot
# reach res/spv, and one that is missing fails the copy instead.
#
# The output lands in res/ by project convention: game assets, including
# compiled shaders, live under a project root's res/. That is also what
# vfs.res_root points at by default. It cannot live under {project.out}
# because #[embed] takes a literal path and {project.out} varies by target
# and profile; SPIR-V is target-independent, so one copy serves every build.
[step.build-shaders]
cmd = "mach build . --target spirv --profile release && mkdir -p res/spv && for m in lit_frag mesh_vert skinned_vert ui_vert ui_frag; do cp out/spirv/release/obj/boom/shaders/$m.spv res/spv/$m.spv; done"
in  = ["src/shaders/*.mach", "mach.toml"]
out = ["res/spv/lit_frag.spv", "res/spv/mesh_vert.spv", "res/spv/skinned_vert.spv", "res/spv/ui_vert.spv", "res/spv/ui_frag.spv"]
need = []

[dep.mach-std]
git = "https://github.com/briar-systems/mach-std"
ref = "branch/main"

[dep.mach-glfw]
git = "https://github.com/briar-systems/mach-glfw"
ref = "branch/main"

[dep.mach-audio]
git = "https://github.com/briar-systems/mach-audio"
ref = "branch/main"

[dep.mach-image]
git = "https://github.com/briar-systems/mach-image"
ref = "branch/main"

[dep.mach-font]
git = "https://github.com/briar-systems/mach-font"
ref = "branch/dev"

[dep.mach-phys]
git = "https://github.com/briar-systems/mach-phys"
ref = "branch/main"

[dep.mach-vk]
git = "https://github.com/briar-systems/mach-vk"
ref = "branch/main"

[dep.mach-gltf]
git = "https://github.com/briar-systems/mach-gltf"
ref = "branch/main"

[dep.mach-shader]
git = "https://github.com/briar-systems/mach-shader"
ref = "branch/main"

[artifact.lit_frag]
kind = "bin"
entry = "shaders/lit_frag.mach"
out = "spv/lit_frag.spv"
targets = ["spirv"]
link = []
need = []

[artifact.mesh_vert]
kind = "bin"
entry = "shaders/mesh_vert.mach"
out = "spv/mesh_vert.spv"
targets = ["spirv"]
link = []
need = []

[artifact.skinned_vert]
kind = "bin"
entry = "shaders/skinned_vert.mach"
out = "spv/skinned_vert.spv"
targets = ["spirv"]
link = []
need = []

[artifact.ui_vert]
kind = "bin"
entry = "shaders/ui_vert.mach"
out = "spv/ui_vert.spv"
targets = ["spirv"]
link = []
need = []

[artifact.ui_frag]
kind = "bin"
entry = "shaders/ui_frag.mach"
out = "spv/ui_frag.spv"
targets = ["spirv"]
link = []
need = []
