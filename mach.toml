[project]
id = "boom"
version = "0.50.0"
mach = "^7"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
arch = "x86_64"
sys  = "linux"
env  = "gnu"
abi  = "sysv64"

[target.linux-arm64]
arch = "aarch64"
sys  = "linux"
env  = "gnu"
abi  = "aapcs64"

[target.windows]
arch = "x86_64"
sys  = "windows"
abi  = "win64"

[target.darwin]
arch = "x86_64"
sys  = "darwin"
abi  = "sysv64"

# boom negotiates down to a vulkan 1.0 instance, so its modules stay within that ceiling
[target.spirv]
arch = "spirv"
sys  = "vulkan"
abi  = "shader"
env  = "vulkan1.0"

[profile.debug]
default = true
optimize = false
debug = true
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

# The shader modules are required rather than committed: a library artifact's
# requirements travel with the dependency, so a consumer's build produces them
# before it compiles the module that embeds them.
[artifact.boom]
default = true
export = true
kind = "static"
entry = "lib/boom.mach"
out = "{project.work}/lib/boom{artifact.suffix}"
targets = ["linux-x86_64", "linux-arm64", "windows", "darwin"]
link = []
need = ["artifact.shader-*"]

# test-only: mach tests one artifact's closure, and nothing the library
# exports reaches the text fixture, so `mach test . -a tests` runs it
[artifact.tests]
kind = "static"
entry = "lib/tests.mach"
out = "{project.work}/lib/tests{artifact.suffix}"
targets = ["linux-x86_64", "linux-arm64", "windows", "darwin"]
link = []
need = ["artifact.shader-*"]

[artifact.shader-lit_frag]
kind = "module"
entry = "bin/shaders/lit_frag.mach"
out = "{project.work}/spv/lit_frag{artifact.suffix}"
targets = ["spirv"]
link = []
need = []

[artifact.shader-mesh_vert]
kind = "module"
entry = "bin/shaders/mesh_vert.mach"
out = "{project.work}/spv/mesh_vert{artifact.suffix}"
targets = ["spirv"]
link = []
need = []

[artifact.shader-skinned_vert]
kind = "module"
entry = "bin/shaders/skinned_vert.mach"
out = "{project.work}/spv/skinned_vert{artifact.suffix}"
targets = ["spirv"]
link = []
need = []

[artifact.shader-ui_vert]
kind = "module"
entry = "bin/shaders/ui_vert.mach"
out = "{project.work}/spv/ui_vert{artifact.suffix}"
targets = ["spirv"]
link = []
need = []

[artifact.shader-ui_frag]
kind = "module"
entry = "bin/shaders/ui_frag.mach"
out = "{project.work}/spv/ui_frag{artifact.suffix}"
targets = ["spirv"]
link = []
need = []

[dep.std]
git = "https://github.com/briar-systems/mach-std"
ref = "branch/dev"

[dep.glfw]
git = "https://github.com/briar-systems/mach-glfw"
ref = "branch/dev"

[dep.audio]
git = "https://github.com/briar-systems/mach-audio"
ref = "branch/dev"

[dep.image]
git = "https://github.com/briar-systems/mach-image"
ref = "branch/dev"

[dep.font]
git = "https://github.com/briar-systems/mach-font"
ref = "branch/dev"

[dep.vk]
git = "https://github.com/briar-systems/mach-vk"
ref = "branch/dev"

[dep.gltf]
git = "https://github.com/briar-systems/mach-gltf"
ref = "branch/dev"

[dep.shader]
git = "https://github.com/briar-systems/mach-shader"
ref = "branch/dev"

[dep.blit]
git = "https://github.com/briar-systems/blit"
ref = "branch/dev"
