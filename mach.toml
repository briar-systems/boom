[project]
id = "boom"
version = "0.32.0"
mach = "^5.12"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
default = true
isa = "x86_64"
os  = "linux"
abi = "sysv64"

[target.windows]
isa = "x86_64"
os  = "windows"
abi = "win64"

[target.darwin]
isa = "x86_64"
os  = "darwin"
abi = "sysv64"

# boom negotiates down to a vulkan 1.0 instance, so its modules stay within that ceiling
[target.spirv]
isa = "spirv"
os  = "freestanding"
abi = "spirv"
env = "vulkan1.0"

[profile.debug]
default = true
opt = 0
debug = true
simd = "scalarize"
vectorize = false
float_reassoc = false

[profile.release]
opt = 2
debug = false
simd = "scalarize"
vectorize = false
float_reassoc = false

# The shader modules are required rather than committed: a library artifact's
# requirements travel with the dependency, so a consumer's build produces them
# before it compiles the module that embeds them.
[artifact.boom]
default = true
kind = "static"
entry = "lib/boom.mach"
out = "lib/boom{artifact.suffix}"
targets = ["linux-x86_64", "windows", "darwin"]
link = []
need = ["artifact.shader-*"]

# test-only: mach tests one artifact's closure, and nothing the library
# exports reaches the text fixture, so `mach test . --lib tests` runs it
[artifact.tests]
kind = "static"
entry = "lib/tests.mach"
out = "lib/tests{artifact.suffix}"
targets = ["linux-x86_64", "windows", "darwin"]
link = []
need = ["artifact.shader-*"]

[artifact.shader-lit_frag]
kind = "bin"
entry = "bin/shaders/lit_frag.mach"
out = "spv/lit_frag{artifact.suffix}"
targets = ["spirv"]
link = []
need = []

[artifact.shader-mesh_vert]
kind = "bin"
entry = "bin/shaders/mesh_vert.mach"
out = "spv/mesh_vert{artifact.suffix}"
targets = ["spirv"]
link = []
need = []

[artifact.shader-skinned_vert]
kind = "bin"
entry = "bin/shaders/skinned_vert.mach"
out = "spv/skinned_vert{artifact.suffix}"
targets = ["spirv"]
link = []
need = []

[artifact.shader-ui_vert]
kind = "bin"
entry = "bin/shaders/ui_vert.mach"
out = "spv/ui_vert{artifact.suffix}"
targets = ["spirv"]
link = []
need = []

[artifact.shader-ui_frag]
kind = "bin"
entry = "bin/shaders/ui_frag.mach"
out = "spv/ui_frag{artifact.suffix}"
targets = ["spirv"]
link = []
need = []

[dep.std]
git = "https://github.com/briar-systems/mach-std"
version = "^8.1"

[dep.glfw]
git = "https://github.com/briar-systems/mach-glfw"
version = "^0.8"

[dep.audio]
git = "https://github.com/briar-systems/mach-audio"
version = "^0.9"

[dep.image]
git = "https://github.com/briar-systems/mach-image"
version = "^0.7"

[dep.font]
git = "https://github.com/briar-systems/mach-font"
version = "^0.8"

[dep.vk]
git = "https://github.com/briar-systems/mach-vk"
version = "^0.6"

[dep.gltf]
git = "https://github.com/briar-systems/mach-gltf"
version = "^0.7"

[dep.shader]
git = "https://github.com/briar-systems/mach-shader"
version = "^0.3"
