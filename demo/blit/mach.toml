[project]
id = "blit-demo"
version = "0.1.0"
mach = "^6"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
default = true
isa = "x86_64"
os  = "linux"
abi = "sysv64"

[target.linux-arm64]
isa = "aarch64"
os  = "linux"
abi = "aapcs64"

[target.windows]
isa = "x86_64"
os  = "windows"
abi = "win64"

[target.darwin]
isa = "x86_64"
os  = "darwin"
abi = "sysv64"

[profile.debug]
default = true
opt = 0
debug = true
simd = "scalarize"
vectorize = false
float_reassoc = false

[profile.release]
opt = 2
debug = false
simd = "scalarize"
vectorize = false
float_reassoc = false

[artifact.blit]
kind = "bin"
entry = "bin/main.mach"
out = "bin/blit{artifact.suffix}"
targets = ["*"]
link = []
need = []

[dep.boom]
path = "../.."

[dep.std]
git = "https://github.com/briar-systems/mach-std"
ref = "tag/v9.0.0"

[dep.blit]
git = "https://github.com/briar-systems/blit"
version = "^0.10"

# blit's demo gallery, from the blit checkout boom pins (realized by
# `mach dep pull .` at boom's root), drawn here by boom's renderer
[dep.gallery]
path = "../../dep/blit/demo/gallery"
