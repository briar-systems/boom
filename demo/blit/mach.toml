[project]
id = "blit_demo"
version = "0.1.0"
mach = "^7"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
arch = "x86_64"
sys  = "linux"
env  = "gnu"
abi  = "sysv64"

[target.linux-arm64]
arch = "aarch64"
sys  = "linux"
env  = "gnu"
abi  = "aapcs64"

[target.windows]
arch = "x86_64"
sys  = "windows"
abi  = "win64"

[target.darwin]
arch = "x86_64"
sys  = "darwin"
abi  = "sysv64"

[profile.debug]
default = true
optimize = false
debug = true
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

[artifact.blit]
kind = "bin"
entry = "bin/main.mach"
out = "{project.work}/bin/blit{artifact.suffix}"
targets = ["*"]
link = []
need = []

[dep.boom]
path = "../.."

[dep.std]
git = "https://github.com/briar-systems/mach-std"
ref = "branch/dev"

[dep.blit]
git = "https://github.com/briar-systems/blit"
ref = "branch/dev"

# the gallery reaches std and toml through blit's own dep/, which a consumer
# never realizes, so this root selects both
[dep.toml]
git = "https://github.com/briar-systems/mach-toml"
ref = "branch/dev"

# blit's demo gallery, from the blit checkout boom pins (realized by
# `mach dep pull .` at boom's root), drawn here by boom's renderer
[dep.gallery]
path = "../../dep/blit/demo/gallery"
