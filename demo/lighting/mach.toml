[project]
id = "lighting"
version = "0.1.0"
mach = "^7"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
arch = "x86_64"
sys  = "linux"
env  = "gnu"
abi  = "sysv64"

[target.linux-arm64]
arch = "aarch64"
sys  = "linux"
env  = "gnu"
abi  = "aapcs64"

[target.windows]
arch = "x86_64"
sys  = "windows"
abi  = "win64"

[target.darwin]
arch = "x86_64"
sys  = "darwin"
abi  = "sysv64"

# the prototype's own shaders, built as spirv artifacts the example embeds.
# one vertex stage serves every fragment stage: every pass here draws quads
# through boom's fixed transform block, and boom.graphics.shader takes the two
# modules separately, so the same compiled vertex module is handed to each
# Shader the example builds.
[target.spirv]
arch = "spirv"
sys  = "vulkan"
abi  = "shader"
env  = "vulkan1.0"

[profile.debug]
default = true
optimize = false
debug = true
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

[artifact.lighting]
default = true
kind = "bin"
entry = "bin/main.mach"
out = "{project.work}/bin/lighting{artifact.suffix}"
targets = ["linux-x86_64", "linux-arm64", "windows", "darwin"]
link = []
need = ["artifact.shader-*"]

[artifact.shader-quad_vert]
kind = "module"
entry = "bin/shaders/quad_vert.mach"
out = "{project.work}/spv/quad_vert{artifact.suffix}"
targets = ["spirv"]
link = []
need = []

[artifact.shader-sprite_vert]
kind = "module"
entry = "bin/shaders/sprite_vert.mach"
out = "{project.work}/spv/sprite_vert{artifact.suffix}"
targets = ["spirv"]
link = []
need = []

[artifact.shader-gbuf_frag]
kind = "module"
entry = "bin/shaders/gbuf_frag.mach"
out = "{project.work}/spv/gbuf_frag{artifact.suffix}"
targets = ["spirv"]
link = []
need = []

[artifact.shader-light_frag]
kind = "module"
entry = "bin/shaders/light_frag.mach"
out = "{project.work}/spv/light_frag{artifact.suffix}"
targets = ["spirv"]
link = []
need = []

[artifact.shader-fwd_frag]
kind = "module"
entry = "bin/shaders/fwd_frag.mach"
out = "{project.work}/spv/fwd_frag{artifact.suffix}"
targets = ["spirv"]
link = []
need = []

[artifact.shader-copy_frag]
kind = "module"
entry = "bin/shaders/copy_frag.mach"
out = "{project.work}/spv/copy_frag{artifact.suffix}"
targets = ["spirv"]
link = []
