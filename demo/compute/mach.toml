[project]
id = "compute"
version = "0.1.0"
mach = "^7"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
arch = "x86_64"
sys  = "linux"
env  = "gnu"
abi  = "sysv64"

[target.linux-arm64]
arch = "aarch64"
sys  = "linux"
env  = "gnu"
abi  = "aapcs64"

[target.windows]
arch = "x86_64"
sys  = "windows"
abi  = "win64"

[target.darwin]
arch = "x86_64"
sys  = "darwin"
abi  = "sysv64"

# the game's own shaders, built for the oldest vulkan environment boom runs on
[target.spirv]
arch = "spirv"
sys  = "vulkan"
abi  = "shader"
env  = "vulkan1.0"

# the stages that reach buffers by address, for a device that gives them one:
# vulkan 1.2, where boom enables bufferDeviceAddress
[target.spirv-address]
arch       = "spirv"
sys        = "vulkan"
abi        = "shader"
env        = "vulkan1.2"
ext        = ["PhysicalStorageBufferAddresses"]

[profile.debug]
default = true
optimize = false
debug = true
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

# the embeds name the stage artifacts, so requiring them builds the modules
# before the program that carries them
[artifact.compute]
default = true
kind = "bin"
entry = "bin/main.mach"
out = "{project.work}/bin/compute{artifact.suffix}"
targets = ["linux-x86_64", "linux-arm64", "windows", "darwin"]
link = []
need = ["artifact.stage-*"]

[artifact.stage-step_comp]
kind = "module"
entry = "bin/shaders/step_comp.mach"
out = "{project.work}/spv/step_comp{artifact.suffix}"
targets = ["spirv"]
link = []
need = []

[artifact.stage-shard_comp]
kind = "module"
entry = "bin/shaders/shard_comp.mach"
out = "{project.work}/spv/shard_comp{artifact.suffix}"
targets = ["spirv-address"]
link = []
need = []

[artifact.stage-cells_vert]
kind = "module"
entry = "bin/shaders/cells_vert.mach"
out = "{project.work}/spv/cells_vert{artifact.suffix}"
targets = ["spirv"]
link = []
need = []

[artifact.stage-cells_frag]
kind = "module"
entry = "bin/shaders/cells_frag.mach"
out = "{project.work}/spv/cells_frag{artifact.suffix}"
targets = ["spirv"]
link = []
need = []

[dep.boom]
path = "../.."

[dep.std]
git = "https://github.com/briar-systems/mach-std"
ref = "branch/dev"
