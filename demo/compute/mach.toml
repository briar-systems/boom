[project]
id = "compute"
version = "0.1.0"
# a stage reaching buffers by address needs mach 6.10.1 (mach#4401)
mach = "^6.10.1"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
isa = "x86_64"
os  = "linux"
abi = "sysv64"

[target.linux-arm64]
isa = "aarch64"
os  = "linux"
abi = "aapcs64"

[target.windows]
isa = "x86_64"
os  = "windows"
abi = "win64"

[target.darwin]
isa = "x86_64"
os  = "darwin"
abi = "sysv64"

# the game's own shaders, built for the oldest vulkan environment boom runs on
[target.spirv]
isa = "spirv"
os  = "freestanding"
abi = "spirv"
env = "vulkan1.0"

# the stages that reach buffers by address, for a device that gives them one:
# vulkan 1.2, where boom enables bufferDeviceAddress
[target.spirv-address]
isa        = "spirv"
os         = "freestanding"
abi        = "spirv"
env        = "vulkan1.2"
extensions = ["buffer_device_address"]

[profile.debug]
default = true
opt = 0
debug = true
simd = "scalarize"
vectorize = false
float_reassoc = false

[profile.release]
opt = 2
debug = false
simd = "scalarize"
vectorize = false
float_reassoc = false

# the embeds name the stage artifacts, so requiring them builds the modules
# before the program that carries them
[artifact.compute]
default = true
kind = "bin"
entry = "bin/main.mach"
out = "bin/compute{artifact.suffix}"
targets = ["linux-x86_64", "linux-arm64", "windows", "darwin"]
link = []
need = ["artifact.stage-*"]

[artifact.stage-step_comp]
kind = "bin"
entry = "bin/shaders/step_comp.mach"
out = "spv/step_comp{artifact.suffix}"
targets = ["spirv"]
link = []
need = []

[artifact.stage-shard_comp]
kind = "bin"
entry = "bin/shaders/shard_comp.mach"
out = "spv/shard_comp{artifact.suffix}"
targets = ["spirv-address"]
link = []
need = []

[artifact.stage-cells_vert]
kind = "bin"
entry = "bin/shaders/cells_vert.mach"
out = "spv/cells_vert{artifact.suffix}"
targets = ["spirv"]
link = []
need = []

[artifact.stage-cells_frag]
kind = "bin"
entry = "bin/shaders/cells_frag.mach"
out = "spv/cells_frag{artifact.suffix}"
targets = ["spirv"]
link = []
need = []

[dep.boom]
path = "../.."

[dep.std]
git = "https://github.com/briar-systems/mach-std"
ref = "tag/v9.0.0"
