# not "shader": the project id roots this example's module paths and would
# shadow mach-shader's, which the stages import as shader.*
[project]
id = "game"
version = "0.3.1"
mach = "^7"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
arch = "x86_64"
sys  = "linux"
env  = "gnu"
abi  = "sysv64"

[target.linux-arm64]
arch = "aarch64"
sys  = "linux"
env  = "gnu"
abi  = "aapcs64"

[target.windows]
arch = "x86_64"
sys  = "windows"
abi  = "win64"

[target.darwin]
arch = "x86_64"
sys  = "darwin"
abi  = "sysv64"

# the game's own shaders, built for the oldest vulkan environment boom runs on
[target.spirv]
arch = "spirv"
sys  = "vulkan"
abi  = "shader"
env  = "vulkan1.0"

[profile.debug]
default = true
optimize = false
debug = true
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

# the embeds name the shader artifacts, so requiring them is what builds the
# modules before the game that carries them
[artifact.shader]
default = true
kind = "bin"
entry = "bin/main.mach"
out = "{project.work}/bin/shader{artifact.suffix}"
targets = ["linux-x86_64", "linux-arm64", "windows", "darwin"]
link = []
need = ["artifact.shader-*"]

[artifact.shader-game_vert]
kind = "module"
entry = "bin/shaders/game_vert.mach"
out = "{project.work}/spv/game_vert{artifact.suffix}"
targets = ["spirv"]
link = []
need = []

[artifact.shader-game_frag]
kind = "module"
entry = "bin/shaders/game_frag.mach"
out = "{project.work}/spv/game_frag{artifact.suffix}"
targets = ["spirv"]
link = []
need = []

[dep.boom]
path = "../.."

[dep.std]
git = "https://github.com/briar-systems/mach-std"
ref = "branch/dev"
