[project]
id      = "shaders"
version = "0.1.0"
src     = "src"
out     = "out"

[target.spirv]
isa = "spirv"
os  = "freestanding"
abi = "spirv"
of  = "spv"

[profile.debug]
opt   = 0
debug = false
simd  = "scalarize"

[profile.release]
opt   = 2
debug = false
simd  = "scalarize"

[artifact.lit_frag]
kind    = "bin"
entry   = "lit_frag.mach"
out     = "lit_frag.spv"
targets = ["spirv"]
link    = []
need    = []

[artifact.mesh_vert]
kind    = "bin"
entry   = "mesh_vert.mach"
out     = "mesh_vert.spv"
targets = ["spirv"]
link    = []
need    = []

[artifact.sprite_vert]
kind    = "bin"
entry   = "sprite_vert.mach"
out     = "sprite_vert.spv"
targets = ["spirv"]
link    = []
need    = []

# sprite_frag is written, staged under pending/, and proven to build. It
# compiles and passes spirv-val on a locally built 4.17.0, emitting
# OpTypeSampledImage and OpImageSampleImplicitLod with the atlas at binding 1
# and the tint at binding 2, and tools/check-uniform-layout.sh confirms those
# match set_layout_sprite. It stays unregistered only until a release carries
# mach#2803, because 4.16.0 cannot parse `sampler2d` and registering it would
# fail every build rather than only the textured path.

[dep.mach-shader]
git = "https://github.com/briar-systems/mach-shader"
ref = "tag/0.1.0"
