[project]
id      = "shaders"
version = "0.1.0"
src     = "src"
out     = "out"

[target.spirv]
isa = "spirv"
os  = "freestanding"
abi = "spirv"
of  = "spv"

[profile.debug]
opt   = 0
debug = false
simd  = "scalarize"

[profile.release]
opt   = 2
debug = false
simd  = "scalarize"

[artifact.lit_frag]
kind    = "bin"
entry   = "lit_frag.mach"
out     = "lit_frag.spv"
targets = ["spirv"]
link    = []
need    = []

[artifact.mesh_vert]
kind    = "bin"
entry   = "mesh_vert.mach"
out     = "mesh_vert.spv"
targets = ["spirv"]
link    = []
need    = []

[artifact.sprite_vert]
kind    = "bin"
entry   = "sprite_vert.mach"
out     = "sprite_vert.spv"
targets = ["spirv"]
link    = []
need    = []

# sprite_frag is written and staged but not built: it needs the sampler
# binding, which lands in a toolchain release after 4.16.0. Registering it now
# would fail every build rather than only the textured path.

[dep.mach-shader]
git = "https://github.com/briar-systems/mach-shader"
ref = "tag/0.1.0"
