name: Release

# the family's shared release (briar-systems/.github mach-release.yml): a pushed
# v* tag is verified against mach.toml and the changelog, runs the full CI with
# heavy: all, then publishes. boom ships no binaries, so there are no assets. a
# workflow_dispatch rehearses the same path and deletes its draft.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# one run per tag: GitHub can deliver a tag push twice, and two runs reaching
# publish leaves an orphan draft. the second waits, finds the release, and ends
# green. never cancel, since that could abort a publish part way
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: briar-systems/.github/.github/workflows/mach-release.yml@main
    with:
      stage: verify

  ci:
    needs: verify
    uses: ./.github/workflows/ci.yml
    with:
      heavy: all

  publish:
    needs: [verify, ci]
    uses: briar-systems/.github/.github/workflows/mach-release.yml@main
    permissions:
      contents: write
    with:
      stage: publish
