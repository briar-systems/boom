name: CI

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch released mach
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/machdl
          gh release download -R briar-systems/mach \
            -p 'mach-*-x86_64-linux.tar.gz' -D /tmp/machdl --clobber
          tar -xzf /tmp/machdl/mach-*-x86_64-linux.tar.gz -C /tmp/machdl
          install -m 0755 /tmp/machdl/mach /usr/local/bin/mach
          mach info

      # mach-glfw vendors GLFW 3.4 and builds it from source with the host cc,
      # so the X11, Wayland, and xkbcommon development headers must be present.
      - name: Install GLFW build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xorg-dev libwayland-bin \
            libwayland-dev libxkbcommon-dev wayland-protocols \
            fonts-dejavu-core mesa-vulkan-drivers vulkan-tools xvfb

      - name: Install spirv-tools
        run: |
          set -euo pipefail
          sudo apt-get install -y spirv-tools

      # the dependencies are the committed dep/ gitlinks, realized in place
      - name: Sync dependencies
        run: mach dep pull .

      - name: Build
        run: mach build .

      # A uniform block is a contract between two separately compiled programs
      # and nothing at runtime checks it. A member at the wrong offset makes the
      # shader read whatever bytes are there, with no diagnostic anywhere.
      # The expected set is derived from the shader-* artifacts the root manifest
      # declares, not written down here. A count restated in this file would go
      # stale with the next shader.
      - name: Validate the emitted SPIR-V
        run: |
          set -euo pipefail
          mach build . --target spirv --profile release
          expected=$(grep -oP '^\[artifact\.shader-\K[^\]]+' mach.toml | sort)
          built=$(ls out/spirv/release/spv | sed 's/\.spv$//' | sort)
          committed=$(ls res/spv | sed 's/\.spv$//' | sort)
          if [ "$expected" != "$built" ] || [ "$expected" != "$committed" ]; then
            echo "res/spv and the built modules do not match the shader artifacts mach.toml declares"
            diff <(echo "$expected") <(echo "$committed") || true
            exit 1
          fi
          for m in $expected; do
            spirv-val --target-env vulkan1.0 "out/spirv/release/spv/$m.spv"
            # The committed modules must be what this source produces, because
            # they are what boom.graphics.spirv embeds. A shader edited without
            # refreshing res/spv would ship the old module, with the source and
            # the binary disagreeing and nothing saying so.
            if ! cmp -s "out/spirv/release/spv/$m.spv" "res/spv/$m.spv"; then
              echo "res/spv/$m.spv does not match a fresh build of src/shaders"
              echo "run 'mach build . --target spirv --profile release' and copy out/spirv/release/spv into res/spv"
              exit 1
            fi
          done

      - name: Test
        run: mach test .

      # The examples are the only check on the shape of the public API: nothing
      # inside boom calls renderer_init or pass_draw_material the way a game
      # does. Each resolves boom by path, so its pull copies this branch rather
      # than anything already pushed.
      - name: Build the examples
        run: |
          set -euo pipefail
          for e in examples/*/; do
            echo "::group::$e"
            (cd "$e" && mach dep pull . && mach build .)
            echo "::endgroup::"
          done

      # Unit tests cover invalid borrowed bytes without touching Vulkan. This
      # finite example exercises the successful upload, releases its encoded
      # source before drawing, then samples and deletes the returned atlas.
      - name: Check borrowed font bytes
        run: |
          timeout --signal=TERM --kill-after=5s 30s xvfb-run -a \
            ./examples/text/out/linux-x86_64/debug/bin/text \
            --font /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
