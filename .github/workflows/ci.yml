name: CI

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch released mach
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/machdl
          gh release download -R briar-systems/mach \
            -p 'mach-*-x86_64-linux.tar.gz' -D /tmp/machdl --clobber
          tar -xzf /tmp/machdl/mach-*-x86_64-linux.tar.gz -C /tmp/machdl
          install -m 0755 /tmp/machdl/mach /usr/local/bin/mach
          mach info

      # mach-glfw's [os.linux].libs cascades "glfw" into every boom link,
      # so the test dispatcher links libglfw even though no test calls it.
      # the stock package satisfies the link input; the tests never invoke GLFW.
      - name: Install GLFW
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libglfw3-dev

      - name: Sync dependencies
        run: mach dep pull

      - name: Build
        run: mach build .

      - name: Test
        run: mach test .
