name: CI

# the family's tiered pipeline (briar-systems/.github mach-lib.yml). boom runs
# one linux leg on a pull request into dev and into main. the examples are a
# glob subproject, and the SPIR-V and xvfb checks live in .github/ci/verify.sh.
# nothing runs on push. cd.yml calls this with heavy: all.

on:
  pull_request:
  workflow_call:
    inputs:
      heavy:
        type: string
        default: none
  workflow_dispatch:
    inputs:
      heavy:
        description: heavy work to run on this ref
        type: choice
        default: none
        options: [none, all]

permissions:
  contents: read

jobs:
  lib:
    uses: briar-systems/.github/.github/workflows/mach-lib.yml@main
    with:
      heavy: ${{ inputs.heavy }}
      # the windows and darwin targets need a C cross toolchain for glfw
      all-targets: false
      # mach-glfw builds GLFW from source with the host cc, the text example
      # needs a latin face and a TrueType Han face, and the examples drive
      # lavapipe under xvfb
      legs: >-
        [{"name": "x86_64-linux", "runs-on": "ubuntu-latest",
          "apt": ["xorg-dev", "libwayland-bin", "libwayland-dev", "libxkbcommon-dev",
                  "wayland-protocols", "fonts-dejavu-core", "fonts-droid-fallback",
                  "mesa-vulkan-drivers",
                  "vulkan-tools", "xvfb", "spirv-tools"]}]
      # the examples are the only check on the shape of the public API: nothing
      # inside boom calls it the way a game does. each resolves boom by path, so
      # its pull copies this branch, and the glob covers a new example unedited.
      subprojects: '[{"path": "examples/*", "build": true, "test": false}]'

  gate:
    if: always()
    needs: [lib]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: briar-systems/.github/.github/actions/gate@main
        with:
          needs: ${{ toJSON(needs) }}
