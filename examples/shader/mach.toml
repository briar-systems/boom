# not "shader": the project id roots this example's module paths and would
# shadow mach-shader's, which the stages import as shader.*
[project]
id = "game"
version = "0.3.1"
mach = "^5.7"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
default = true
isa = "x86_64"
os  = "linux"
abi = "sysv64"

[target.windows]
isa = "x86_64"
os  = "windows"
abi = "win64"

[target.darwin]
isa = "x86_64"
os  = "darwin"
abi = "sysv64"

# the game's own shaders, built for the oldest vulkan environment boom runs on
[target.spirv]
isa = "spirv"
os  = "freestanding"
abi = "spirv"
env = "vulkan1.0"

[profile.debug]
default = true
opt = 0
debug = true
simd = "scalarize"
vectorize = false
float_reassoc = false

[profile.release]
opt = 2
debug = false
simd = "scalarize"
vectorize = false
float_reassoc = false

# the embeds name the shader artifacts, so requiring them is what builds the
# modules before the game that carries them
[artifact.shader]
default = true
kind = "bin"
entry = "main.mach"
out = "bin/shader{artifact.suffix}"
targets = ["linux-x86_64", "windows", "darwin"]
link = []
need = ["artifact.shader-*"]

[artifact.shader-game_vert]
kind = "bin"
entry = "shaders/game_vert.mach"
out = "spv/game_vert{artifact.suffix}"
targets = ["spirv"]
link = []
need = []

[artifact.shader-game_frag]
kind = "bin"
entry = "shaders/game_frag.mach"
out = "spv/game_frag{artifact.suffix}"
targets = ["spirv"]
link = []
need = []

[dep.boom]
path = "../.."

[dep.std]
git = "https://github.com/briar-systems/mach-std"
version = "^5.7.1"

[dep.shader]
git = "https://github.com/briar-systems/mach-shader"
ref = "tag/v0.3.0"
