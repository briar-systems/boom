[project]
id = "shader"
version = "0.3.1"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
isa = "x86_64"
os  = "linux"
abi = "sysv64"

[target.windows]
isa = "x86_64"
os  = "windows"
abi = "win64"

[target.darwin]
isa = "x86_64"
os  = "darwin"
abi = "sysv64"

[profile.debug]
opt = 0
debug = true
simd = "scalarize"

[profile.release]
opt = 2
debug = false
simd = "scalarize"

[artifact.shader]
kind = "bin"
entry = "main.mach"
out = "bin/shader"
targets = ["*"]
link = []
need = ["build-shaders"]

# The game's own shaders, compiled to SPIR-V and embedded into the binary. This
# is the shape a game copies: boom does not compile shaders and does not need
# to, so a game that wants its own carries a spirv project of its own.
#
# The artifact above declares `need` on this step because `#[embed]` is not an
# edge in the build graph (mach#2887): without it the embed would look for a
# file nothing had been asked to produce, and fail on a fresh checkout while
# working on every machine that had built once.
#
# The modules are named in the copy rather than globbed, for the reason boom's
# own build step learned: a glob takes whatever is in the directory, including
# the output of a shader that has since been deleted.
[step.build-shaders]
cmd = "cd shaders && mach dep pull && mach build . --target spirv --profile release && cd .. && mkdir -p res/spv && for m in game_vert game_frag; do cp shaders/out/obj/gameshaders/$m.spv res/spv/$m.spv; done"
in  = ["shaders/src/*.mach", "shaders/mach.toml"]
out = ["res/spv/game_vert.spv", "res/spv/game_frag.spv"]
need = []

# A path dep, not a branch pin: the example is a standalone consumer of boom,
# but resolving boom from a branch would build what is already pushed rather
# than what is being changed, so a break in the API would only surface after a
# merge. The path keeps it a real consumer and a real check at the same time.
[dep.boom]
path = "../.."

[dep.mach-std]
git = "https://github.com/briar-systems/mach-std"
ref = "branch/main"

[dep.mach-glfw]
git = "https://github.com/briar-systems/mach-glfw"
ref = "branch/main"

[dep.mach-image]
git = "https://github.com/briar-systems/mach-image"
ref = "branch/main"

[dep.mach-gltf]
git = "https://github.com/briar-systems/mach-gltf"
ref = "branch/main"

# boom links these transitively, but a consumer must still name every dep it
# shares with a path dependency and match its ref exactly.
[dep.mach-audio]
git = "https://github.com/briar-systems/mach-audio"
ref = "branch/main"

[dep.mach-font]
git = "https://github.com/briar-systems/mach-font"
ref = "branch/dev"

[dep.mach-phys]
git = "https://github.com/briar-systems/mach-phys"
ref = "branch/main"

[dep.mach-vk]
git = "https://github.com/briar-systems/mach-vk"
ref = "branch/main"
