[project]
id = "vulkan"
version = "0.3.1"
mach = "^5.7"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
default = true
isa = "x86_64"
os  = "linux"
abi = "sysv64"

[target.windows]
isa = "x86_64"
os  = "windows"
abi = "win64"

[target.darwin]
isa = "x86_64"
os  = "darwin"
abi = "sysv64"

[profile.debug]
default = true
opt = 0
debug = true
simd = "scalarize"
vectorize = false
float_reassoc = false

[profile.release]
opt = 2
debug = false
simd = "scalarize"
vectorize = false
float_reassoc = false

[artifact.vulkan]
kind = "bin"
entry = "main.mach"
out = "bin/vulkan{artifact.suffix}"
targets = ["*"]
link = []
need = []

[dep.boom]
path = "../.."
