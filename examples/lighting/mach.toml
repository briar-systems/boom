need = []

[artifact.shader-light_frag]
kind = "bin"
entry = "shaders/light_frag.mach"
out = "spv/light_frag{artifact.suffix}"
targets = ["spirv"]
link = []
need = []

[artifact.shader-fwd_frag]
kind = "bin"
entry = "shaders/fwd_frag.mach"
out = "spv/fwd_frag{artifact.suffix}"
targets = ["spirv"]
link = []
need = []

[artifact.shader-copy_frag]
kind = "bin"
entry = "shaders/copy_frag.mach"
out = "spv/copy_frag{artifact.suffix}"
targets = ["spirv"]
link = []
need = []

[artifact.shader-bloom_frag]
kind = "bin"
entry = "shaders/bloom_frag.mach"
out = "spv/bloom_frag{artifact.suffix}"
targets = ["spirv"]
link = []
